name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ubuntu 26.04 packages, matching the Docker image toolchain; Node/npx is preinstalled on the
      # runner and fetches the pinned prettier
      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cmake-format shfmt
          clang-format --version
          cmake-format --version
          shfmt --version
          npx --version

      # Same check as the format-check preset, without configuring the project
      - name: Check formatting
        run: cmake -P cmake/format.cmake
