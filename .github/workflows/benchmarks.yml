name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same packages as docker/Dockerfile
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libboost-dev \
            libboost-system-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            liburing-dev

      - name: Configure
        run: cmake --preset benchmarks

      - name: Build
        run: cmake --build --preset benchmarks

      # Writes build/benchmarks/benchmark-results/<binary>.json
      - name: Run benchmarks
        run: cmake --build --preset benchmarks-report

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/benchmarks/benchmark-results
          if-no-files-found: ignore
