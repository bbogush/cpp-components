name: Build Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same packages as docker/Dockerfile
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libboost-dev \
            libboost-system-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            liburing-dev \
            ninja-build

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release
