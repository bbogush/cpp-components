name: Unit Tests (Valgrind Memcheck)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests-valgrind-memcheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same packages as docker/Dockerfile
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            valgrind \
            libboost-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            liburing-dev

      - name: Configure
        run: cmake --preset tests-valgrind-memcheck

      - name: Build
        run: cmake --build --preset tests-valgrind-memcheck

      - name: Test
        run: ctest --preset tests-valgrind-memcheck
